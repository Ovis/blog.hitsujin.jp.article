name: Production Deployment Request

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  deploy-production:
    name: Request production deployment
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BLOG_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.BLOG_DEPLOY_APP_PRIVATE_KEY }}
          owner: Ovis
          repositories: blog.hitsujin.jp
          permission-contents: write

      - name: Dispatch production deployment
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: Ovis/blog.hitsujin.jp
          event-type: production