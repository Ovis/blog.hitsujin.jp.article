name: Article PR / Staging

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed

  workflow_dispatch:
    inputs:
      branch:
        description: 'ステージング対象の記事リポジトリのブランチ'
        required: true
        default: 'master'
        type: string
      use_prerelease:
        description: 'BlogGenerator のプレリリース版を使用する'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Request staging deployment
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BLOG_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.BLOG_DEPLOY_APP_PRIVATE_KEY }}
          owner: Ovis
          repositories: blog.hitsujin.jp
          permission-contents: write

      - name: Dispatch staging deployment
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: Ovis/blog.hitsujin.jp
          event-type: staging
          client-payload: |
            {
              "branch": "${{ github.event.pull_request.head.ref }}",
              "use_prerelease": false
            }

  manual-staging:
    name: Request manual staging deployment
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BLOG_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.BLOG_DEPLOY_APP_PRIVATE_KEY }}
          owner: Ovis
          repositories: blog.hitsujin.jp
          permission-contents: write

      - name: Dispatch staging deployment
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: Ovis/blog.hitsujin.jp
          event-type: staging
          client-payload: |
            {
              "branch": "${{ inputs.branch }}",
              "use_prerelease": ${{ inputs.use_prerelease }}
            }

  close-staging:
    name: Close staging deployment
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BLOG_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.BLOG_DEPLOY_APP_PRIVATE_KEY }}
          owner: Ovis
          repositories: blog.hitsujin.jp
          permission-contents: write

      - name: Dispatch staging close
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: Ovis/blog.hitsujin.jp
          event-type: close-staging
