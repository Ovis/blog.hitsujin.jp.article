name: Article PR / Staging

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed

  workflow_dispatch:
    inputs:
      branch:
        description: 'ステージング対象の記事リポジトリのブランチ'
        required: true
        default: 'master'
        type: string
      use_prerelease:
        description: 'BlogGenerator のプレリリース版を使用する'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  compress-images:
    name: Compress images
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout article repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Compress images
        id: compress
        uses: Ovis/image-compression-action@main
        with:
          jpeg_max_quality: "80"
          jpeg_compression_threshold: "5"
          png_compression_threshold: "40"

      - name: Commit compressed images
        if: steps.compress.outputs.any_image_compressed == 'true'
        uses: EndBug/add-and-commit@v10
        with:
          message: 'Compress images'
          default_author: github_actions

  deploy-staging:
    name: Request staging deployment
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    needs: compress-images
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BLOG_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.BLOG_DEPLOY_APP_PRIVATE_KEY }}
          owner: Ovis
          repositories: blog.hitsujin.jp
          permission-contents: write

      - name: Dispatch staging deployment
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: Ovis/blog.hitsujin.jp
          event-type: staging
          client-payload: |
            {
              "branch": "${{ github.event.pull_request.head.ref }}",
              "use_prerelease": false
            }

  manual-staging:
    name: Request manual staging deployment
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BLOG_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.BLOG_DEPLOY_APP_PRIVATE_KEY }}
          owner: Ovis
          repositories: blog.hitsujin.jp
          permission-contents: write

      - name: Dispatch staging deployment
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: Ovis/blog.hitsujin.jp
          event-type: staging
          client-payload: |
            {
              "branch": "${{ inputs.branch }}",
              "use_prerelease": ${{ inputs.use_prerelease }}
            }

  close-staging:
    name: Close staging deployment
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BLOG_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.BLOG_DEPLOY_APP_PRIVATE_KEY }}
          owner: Ovis
          repositories: blog.hitsujin.jp
          permission-contents: write

      - name: Dispatch staging close
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: Ovis/blog.hitsujin.jp
          event-type: close-staging

